name: Strava to Google Sheet Crawler

on:
  schedule:
    # 每 30 分鐘自動在雲端執行一次
    - cron: '*/30 * * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點按鈕立即執行
  push:
    paths:
      - 'data/crawler_config.json'

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 gspread google-auth

      - name: Run Strava Scraper
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          STRAVA_COOKIE: ${{ secrets.STRAVA_COOKIE }}
        run: |
          python scripts/strava_scraper.py
