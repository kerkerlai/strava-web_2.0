<!DOCTYPE html>

<head>
<script>
window.onerror = function(msg, url, lno, col, e) {
    document.body.innerHTML += "<h1 class='err'>ERROR: " + msg + " at " + lno + "</h1>";
};
const originalConsoleError = console.error;
console.error = function() {
    originalConsoleError.apply(console, arguments);
    document.body.innerHTML += "<h1 class='err'>CONSOLE.ERROR: " + Array.from(arguments).join(" ") + "</h1>";
};
</script>
